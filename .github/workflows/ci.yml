name: CI

on:
  push:
    branches: [main]
  pull_request:
  # collab's CI verify ("verify": "ci" in .collab.json) dispatches this workflow on a task branch.
  workflow_dispatch:
    inputs:
      full:
        description: "Run on Windows too, as for a PR into the default branch"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        # Two tiers. Windows matters: junction links, CRLF shims and path handling only break there.
        # It is also the slow half, so it runs where a change is about to reach the default branch:
        # pushes to it, PRs into it, and a dispatch with "full" set. A PR into any other branch (a
        # collab sub-PR into its PR branch, or a stacked PR) and a collab verify dispatch run on Linux
        # only. Their changes still meet Windows on the PR into the default branch.
        os: ${{ fromJSON((github.event_name == 'push' || github.base_ref == github.event.repository.default_branch || inputs.full) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        node: [22, 24]
        # scripts/test-shard.mjs splits the test files by their measured time on each OS. The 3 in
        # the name above and in the test step must equal the length of this list.
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    # Each shard takes about 2 minutes on Linux and 7 on Windows, on a private repo's 2-core runner,
    # where node runs the test files one at a time. The whole suite in one Windows job took about 19.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name "collab-ci" && git config --global user.email "collab-ci@users.noreply.github.com"
      # The files npm test runs (package.json scripts.test), this shard's share of them. node's own
      # --test-shard deals the files out in turn, which put the slowest together: one Windows shard
      # took 11 minutes while another took 4. The step also logs each file's time; to refresh the
      # split after a full run: gh run view <run id> --log | node scripts/test-shard.mjs --update
      - run: node scripts/test-shard.mjs ${{ matrix.shard }}/3
